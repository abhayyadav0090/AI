services:
  nexos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexos-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MONGO_URI=${MONGO_URI:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - LEGACY_REDIRECTS_JSON=${LEGACY_REDIRECTS_JSON:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.nexos.description=NexOS AI Productivity OS"
      - "com.nexos.version=2.2.1"

  # Optional TLS reverse proxy. Replace yourdomain.com in nginx.docker.conf with
  # your real domain and install its Let's Encrypt certificate on the Docker host.
  nginx:
    image: nginx:alpine
    container_name: nexos-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      nexos:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - production
